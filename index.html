<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
  <title>Jeemo</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous"/>
  <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>

<!-- ══ GATE ══ -->
<div id="screen-gate" class="screen active">
  <div class="gate-glow g1"></div>
  <div class="gate-glow g2"></div>
  <div class="gate-card">
    <div class="gate-logo">
      <div class="gate-logo-icon"><i class="fa-solid fa-hexagon-nodes"></i></div>
      <div>
        <div class="gate-logo-name">Jeemo<span class="cx">.</span></div>
        <div class="gate-logo-sub">Powered by Groq · Llama 3.3 70B</div>
      </div>
    </div>
    <div class="gate-field">
      <label class="gate-label"><i class="fa-solid fa-key"></i> Groq API Key</label>
      <div class="gate-input-wrap">
        <input id="gate-input" type="password" placeholder="gsk_…" autocomplete="off" spellcheck="false"/>
        <button id="gate-eye" class="icon-btn"><i class="fa-solid fa-eye"></i></button>
      </div>
      <div id="gate-err" class="gate-err hidden">
        <i class="fa-solid fa-circle-exclamation"></i>
        <span id="gate-err-msg"></span>
      </div>
      <button id="gate-btn" class="gate-btn">
        <span id="gate-btn-t">Start chatting</span>
        <span id="gate-btn-l" class="hidden"><i class="fa-solid fa-circle-notch fa-spin"></i> Checking…</span>
      </button>
    </div>
    <div class="gate-footer">
      <a href="https://console.groq.com/keys" target="_blank" rel="noopener" class="gate-link">
        <i class="fa-solid fa-arrow-up-right-from-square"></i> Get a free API key at console.groq.com
      </a>
    </div>
  </div>
</div>

<!-- ══ APP ══ -->
<div id="screen-app" class="screen hidden">

  <!-- Sidebar -->
  <div id="sidebar" class="sidebar-open">
    <div class="sb-top">
      <button id="btn-new" class="new-chat-btn">
        <i class="fa-solid fa-pen-to-square"></i> New chat
      </button>
    </div>
    <div id="conv-list" class="conv-list"></div>
    <div class="sb-bottom">
      <div id="py-chip" class="py-chip loading">
        <i class="fa-solid fa-circle-notch fa-spin"></i> <span>Loading Python…</span>
      </div>
      <button id="btn-logout" class="sb-logout">
        <i class="fa-solid fa-right-from-bracket"></i> Change API key
      </button>
    </div>
  </div>

  <!-- Sidebar overlay (mobile) -->
  <div id="sb-overlay"></div>

  <!-- Main -->
  <div id="main">

    <!-- Top bar -->
    <div id="topbar">
      <button id="btn-sidebar-toggle" class="icon-btn">
        <i class="fa-solid fa-bars"></i>
      </button>
      <span id="conv-title" class="conv-title-text">New chat</span>
      <div class="topbar-right">
        <button id="btn-files" class="icon-btn" title="Files & outputs">
          <i class="fa-solid fa-folder-open"></i>
        </button>
        <button id="btn-clear" class="icon-btn" title="Clear chat">
          <i class="fa-solid fa-broom"></i>
        </button>
      </div>
    </div>

    <!-- Messages -->
    <div id="messages"></div>

    <!-- Composer -->
    <div id="composer-wrap">
      <div id="composer">
        <textarea id="msg-input" placeholder="Message Jeemo…" rows="1" autocomplete="off"></textarea>
        <button id="btn-send">
          <i class="fa-solid fa-arrow-up"></i>
        </button>
      </div>
      <p class="composer-hint"><kbd>Enter</kbd> send · <kbd>Shift+Enter</kbd> newline</p>
    </div>

  </div>
</div>

<!-- Files modal -->
<div id="files-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-hdr">
      <span><i class="fa-solid fa-folder-open"></i> Files</span>
      <button id="btn-files-close" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div id="files-list" class="files-list"></div>
  </div>
</div>

<!-- File viewer modal -->
<div id="viewer-modal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-hdr">
      <span id="viewer-name"></span>
      <div style="display:flex;gap:6px">
        <button id="btn-viewer-dl" class="action-btn"><i class="fa-solid fa-download"></i> Download</button>
        <button id="btn-viewer-close" class="icon-btn"><i class="fa-solid fa-xmark"></i></button>
      </div>
    </div>
    <pre id="viewer-content" class="viewer-pre"></pre>
  </div>
</div>

<!-- Hidden Pyodide container -->
<div id="py-container" aria-hidden="true"
     style="position:fixed;left:-9999px;width:1px;height:1px;overflow:hidden"></div>

<script src="app.js"></script>
</body>
</html>
